name: Build and publish release

on:
  workflow_dispatch:
    inputs:
      prerelease:
        description: Publish as a Beta/pre-release
        required: true
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore solution and pinned release tool
        shell: pwsh
        run: |
          dotnet restore ATAG.Costing.sln -p:Platform=x64
          dotnet tool restore

      - name: Build, test, audit, and package
        shell: pwsh
        run: ./tools/Build-Release.ps1

      - name: Read authoritative version
        id: version
        shell: pwsh
        run: |
          [xml]$props = Get-Content ./Directory.Build.props
          $version = [string]($props.Project.PropertyGroup.CostingAppVersion | Select-Object -First 1)
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Publish public GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          IS_PRERELEASE: ${{ inputs.prerelease }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          $arguments = @(
            'release', 'create', "v$env:VERSION",
            './artifacts/release/releases/*',
            '--repo', $env:GITHUB_REPOSITORY,
            '--target', $env:GITHUB_SHA,
            '--title', "Costing App $env:VERSION",
            '--notes-file', './artifacts/release/release-notes.md'
          )
          if ($env:IS_PRERELEASE -eq 'true') {
            $arguments += '--prerelease'
          }
          & gh @arguments
          if ($LASTEXITCODE -ne 0) {
            throw 'GitHub release publication failed.'
          }

      - name: Retain installer build evidence
        uses: actions/upload-artifact@v4
        with:
          name: Costing-App-${{ steps.version.outputs.version }}
          path: artifacts/release/releases/
          if-no-files-found: error
